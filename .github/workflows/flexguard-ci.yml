name: FlexGuard CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  flexguard-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FieldSync API
        run: |
          nohup uvicorn fieldsync.main:app \
          --host 127.0.0.1 \
          --port 8000 > fieldsync.log 2>&1 &

      - name: Start Chaos Proxy
        run: |
          nohup uvicorn guard_engine.chaos.proxy:app \
          --host 127.0.0.1 \
          --port 9000 > proxy.log 2>&1 &

      - name: Wait for services
        run: |
          sleep 5

      - name: Run FlexGuard CI
        run: |
          python -m guard_engine.ci_runner

      - name: Upload FlexGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexguard-report
          path: reports/flexguard_report.json